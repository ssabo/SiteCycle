name: Lint

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'images/**'
      - '*.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Catches .swift files missing from their target, reused object IDs and
      # references to deleted files: easy mistakes when hand-editing project.pbxproj.
      - name: Check Xcode project file
        run: python3 scripts/check_project.py

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
