name: UI Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'SiteCycle/**'
      - 'SiteCycleUITests/**'
      - 'SiteCycle.xcodeproj/**'
      - 'SiteCycleConfig.xcconfig'
      - '.github/workflows/ui-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Find iOS Simulator
        run: |
          SIMULATOR_NAME=$(xcrun simctl list devices available iPhone -j | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if d['isAvailable']:
                          print(d['name'])
                          sys.exit(0)
          print('iPhone 16')
          ")
          echo "SIMULATOR_NAME=$SIMULATOR_NAME" >> "$GITHUB_ENV"
          echo "Using simulator: $SIMULATOR_NAME"

      - name: Build for iOS Simulator
        run: |
          xcodebuild build-for-testing \
            -scheme SiteCycle \
            -project SiteCycle.xcodeproj \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -only-testing:SiteCycleUITests \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run UI Tests
        run: |
          xcodebuild test-without-building \
            -scheme SiteCycle \
            -project SiteCycle.xcodeproj \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -only-testing:SiteCycleUITests \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
